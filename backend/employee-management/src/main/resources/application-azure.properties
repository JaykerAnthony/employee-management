# Required Azure settings intentionally have no localhost/credential fallback.
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME:EmployeeDetails}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
server.forward-headers-strategy=framework
